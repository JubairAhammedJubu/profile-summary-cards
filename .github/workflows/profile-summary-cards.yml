name: GitHub Profile Summary Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Cards
        uses: vn7n24fzkq/github-profile-summary-cards@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: JubairAhammedJubu
          UTC_OFFSET: +06:00
